<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>THORWallet — App UI Kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg-base);color:var(--text-mid);font-family:var(--font-body);min-height:100vh;display:grid;place-items:center;padding:40px 24px}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--mesh)}
#root{position:relative;z-index:1}
a{color:var(--accent-solid)}a:hover{color:var(--accent-to)}
.kit{display:flex;align-items:center;gap:56px;flex-wrap:wrap;justify-content:center}
.phone{position:relative;width:411px;aspect-ratio:1320/2868;border-radius:14% / 6.5%;background:#05101A;border:1px solid var(--hairline-strong);padding:2.6%;box-shadow:var(--shadow-ambient),0 0 130px -40px var(--accent-glow);flex:none}
.phone .screen{width:100%;height:100%;border-radius:11% / 5.2%;overflow:hidden;background:var(--app-bg);position:relative}
.legend{max-width:340px}
.legend h1{font-family:var(--font-display);font-weight:600;font-size:2rem;letter-spacing:-0.025em;color:var(--text-hi);line-height:1.05}
.legend p{margin-top:14px;font-size:0.98rem;color:var(--text-low);line-height:1.6}
.legend ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:2px}
.legend button{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--hairline);padding:13px 2px;font-family:var(--font-body);font-size:0.98rem;color:var(--text-mid);cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.legend button:hover{color:var(--text-hi)}
.legend button.on{color:var(--accent-solid)}
.legend button span{font-family:var(--font-mono);font-size:0.66rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-faint)}
</style></head><body><div id="root"></div>
<script type="text/babel" src="AppKit.jsx"></script>
<script type="text/babel">ReactDOM.createRoot(document.getElementById('root')).render(<AppKit/>);</script>
</body></html>
