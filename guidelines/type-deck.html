<!DOCTYPE html><html><head><meta charset="utf-8"><title>Deck type</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;flex-direction:column;gap:9px">
<div style="display:flex;gap:16px;align-items:baseline"><span class="lbl" style="width:88px">Title 62px</span><span style="font-family:var(--font-display);font-weight:600;font-size:31px;letter-spacing:-0.03em">Two giants own the market</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="lbl" style="width:88px">Subtitle 25px</span><span style="font-size:16px;color:var(--text-mid)">We're built to take on both.</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="lbl" style="width:88px">Body 19px</span><span style="font-size:14px;color:var(--text-mid)">Everyday spend, custodial, profitable.</span></div>
<div style="display:flex;gap:16px;align-items:baseline"><span class="lbl" style="width:88px">Micro 12px</span><span style="font-size:11px;color:var(--text-low)">Volume = annualized run-rates.</span></div>
</div></body></html>
