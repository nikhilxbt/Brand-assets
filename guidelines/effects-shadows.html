<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows & Glow" subtitle="Inset hairline + ambient; glow is the brand depth cue" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Shadows</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;gap:14px">
<div style="flex:1;height:84px;border-radius:16px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-inset-top);display:flex;align-items:flex-end;padding:10px"><span class="v">inset top 4%</span></div>
<div style="flex:1;height:84px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-ambient);display:flex;align-items:flex-end;padding:10px"><span class="v">ambient</span></div>
<div style="flex:1;height:84px;border-radius:16px;background:var(--surface);border:1px solid var(--accent-line);box-shadow:var(--shadow-glow);display:flex;align-items:flex-end;padding:10px"><span class="v">accent glow</span></div>
<div style="flex:1;height:84px;border-radius:16px;background:var(--blue);box-shadow:var(--shadow-blue);display:flex;align-items:flex-end;padding:10px"><span class="v" style="color:rgba(255,255,255,.8)">blue glow</span></div>
</div></body></html>
