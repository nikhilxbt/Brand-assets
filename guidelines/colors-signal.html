<!DOCTYPE html><html><head><meta charset="utf-8"><title>Signal</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div class="sw"><div class="s" style="flex:2.2"><div class="c" style="background:var(--signal)"></div><div class="n">Signal</div><div class="v">linear-gradient(120deg, #00CCFF, #19DAC8 52%, #33FF99)</div></div><div class="s"><div class="c" style="background:#00CCFF"></div><div class="n">From</div><div class="v">#00CCFF</div></div><div class="s"><div class="c" style="background:#33FF99"></div><div class="n">To</div><div class="v">#33FF99</div></div><div class="s"><div class="c" style="background:#1FD9A6"></div><div class="n">Solid</div><div class="v">#1FD9A6</div></div></div></body></html>
