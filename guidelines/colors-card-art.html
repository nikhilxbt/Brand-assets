<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card art</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div class="sw">
<div class="s"><div class="c" style="background:linear-gradient(140deg,#F0531F,#B0186A);height:82px"></div><div class="n">Basic — sunrise magenta</div><div class="v">#F0531F → #B0186A</div></div>
<div class="s"><div class="c" style="background:linear-gradient(140deg,#14534A,#0A2A24);height:82px"></div><div class="n">Premium — pine teal</div><div class="v">#14534A → #0A2A24</div></div>
<div class="s"><div class="c" style="background:linear-gradient(140deg,#3B82F6,#1D3FB0);height:82px"></div><div class="n">Swiss — electric blue</div><div class="v">#3B82F6 → #1D3FB0</div></div>
</div></body></html>
