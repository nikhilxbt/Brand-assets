<!-- @dsCard group="Colors" viewport="700x160" name="Ink Scale" subtitle="Four text weights — cool whites, never pure grey" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ink</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;flex-direction:column;gap:9px">
<div class="row"><span style="font-size:19px;font-weight:600;color:var(--text-hi);letter-spacing:-0.02em;width:200px">Primary heading</span><span class="lbl">--text-hi</span><span class="v" style="font-family:var(--font-mono);font-size:10px;color:var(--text-low)">#FFFFFF</span></div>
<div class="row"><span style="font-size:15px;color:var(--text-mid);width:200px">Body and lede copy</span><span class="lbl">--text-mid</span><span class="v" style="font-family:var(--font-mono);font-size:10px;color:var(--text-low)">#C5D2DE</span></div>
<div class="row"><span style="font-size:14px;color:var(--text-low);width:200px">Captions, meta, eyebrows</span><span class="lbl">--text-low</span><span class="v" style="font-family:var(--font-mono);font-size:10px;color:var(--text-low)">#8A9DB0</span></div>
<div class="row"><span style="font-size:13px;color:var(--text-faint);width:200px">Disabled and faint</span><span class="lbl">--text-faint</span><span class="v" style="font-family:var(--font-mono);font-size:10px;color:var(--text-low)">#5F7286</span></div>
</div></body></html>
