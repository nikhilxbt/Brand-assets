<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;align-items:flex-end;gap:9px"><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:4px;height:4px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:8px;height:8px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:12px;height:12px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:16px;height:16px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:24px;height:24px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:32px;height:32px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">32</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:48px;height:48px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">48</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:56px;height:56px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">64</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:56px;height:56px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">96</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:7px"><div style="width:56px;height:56px;background:var(--signal);border-radius:3px;opacity:.9"></div><span class="v">128</span></div></div></body></html>
