<!DOCTYPE html><html><head><meta charset="utf-8"><title>Card art</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;gap:12px">
<img src="../assets/cards/card-basic.png" alt="Basic" style="flex:1;min-width:0;border-radius:10px">
<img src="../assets/cards/card-premium.png" alt="Premium" style="flex:1;min-width:0;border-radius:10px">
<img src="../assets/cards/card-swiss.png" alt="Swiss" style="flex:1;min-width:0;border-radius:10px">
<img src="../assets/cards/c-gold.png" alt="Gold" style="flex:1;min-width:0;border-radius:10px">
</div></body></html>
