<!-- @dsCard group="Colors" viewport="700x140" name="Hairlines" subtitle="Borders are white-alpha, never a grey hex" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Hairlines</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div style="display:flex;gap:12px">
<div style="flex:1;height:78px;border-radius:12px;background:var(--surface);border:1px solid var(--hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:10px"><span class="n" style="font-size:11px">Default</span><span class="v">rgba(255,255,255,.08)</span></div>
<div style="flex:1;height:78px;border-radius:12px;background:var(--surface);border:1px solid var(--hairline-strong);display:flex;flex-direction:column;justify-content:flex-end;padding:10px"><span class="n" style="font-size:11px">Strong</span><span class="v">rgba(255,255,255,.15)</span></div>
<div style="flex:1;height:78px;border-radius:12px;background:var(--surface);border:1px solid var(--accent-line);display:flex;flex-direction:column;justify-content:flex-end;padding:10px"><span class="n" style="font-size:11px">Accent</span><span class="v">rgba(0,204,255,.30)</span></div>
</div></body></html>
