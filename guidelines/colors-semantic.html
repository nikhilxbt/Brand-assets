<!DOCTYPE html><html><head><meta charset="utf-8"><title>Semantic</title><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{background:var(--bg-base);color:var(--text-hi);font-family:var(--font-body);padding:18px 20px;display:flex;flex-direction:column;justify-content:center;min-height:100vh}.sw{display:flex;gap:10px}.s{flex:1;display:flex;flex-direction:column;gap:7px}.s .c{height:66px;border-radius:10px;border:1px solid var(--hairline)}.s .n{font-size:11px;font-weight:500;color:var(--text-hi);letter-spacing:-0.01em}.s .v{font-family:var(--font-mono);font-size:9.5px;color:var(--text-low);letter-spacing:0.04em}.row{display:flex;align-items:center;gap:14px}.lbl{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-low)}</style></head><body><div class="sw"><div class="s"><div class="c" style="background:#33E0A0"></div><div class="n">Success</div><div class="v">#33E0A0</div></div><div class="s"><div class="c" style="background:#E7A23C"></div><div class="n">Warning</div><div class="v">#E7A23C</div></div><div class="s"><div class="c" style="background:#E2603F"></div><div class="n">Danger</div><div class="v">#E2603F</div></div><div class="s"><div class="c" style="background:#57A4FF"></div><div class="n">Info</div><div class="v">#57A4FF</div></div><div class="s"><div class="c" style="background:#D4AF37"></div><div class="n">Gold</div><div class="v">#D4AF37</div></div></div></body></html>
