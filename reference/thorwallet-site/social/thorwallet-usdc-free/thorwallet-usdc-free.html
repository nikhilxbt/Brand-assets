<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THORWallet — Native USDC swaps, 100% free</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A1420; --bg2:#0E1B2E; --surface:#16263B; --surface2:#1C3046;
    --border:rgba(255,255,255,0.09); --border-str:rgba(255,255,255,0.16);
    --ink:#FFFFFF; --ink2:#C7D4DE; --ink3:#8FA6B4;
    --cyan:#00CCFF; --green:#33FF99; --acc:#31FD9D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#05090f;}
  .stage{
    position:relative; width:1600px; height:900px; overflow:hidden;
    font-family:"Montserrat",system-ui,sans-serif; color:var(--ink);
    background:
      radial-gradient(1100px 700px at 88% 18%, rgba(0,204,255,0.16), transparent 60%),
      radial-gradient(1000px 800px at 6% 96%, rgba(51,255,153,0.14), transparent 62%),
      linear-gradient(155deg, #0E1B2E 0%, #0A1420 55%, #07101B 100%);
  }
  /* subtle grid */
  .grid{position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,0.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.028) 1px,transparent 1px);
    background-size:64px 64px; mask-image:radial-gradient(120% 120% at 50% 40%,#000 55%,transparent 100%);}
  .glow{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none;}
  .g1{width:520px;height:520px; right:-120px; top:-160px; background:rgba(0,204,255,.28);}
  .g2{width:560px;height:560px; left:-180px; bottom:-220px; background:rgba(51,255,153,.22);}

  .wrap{position:absolute; inset:0; display:grid; grid-template-columns:1fr 560px; gap:40px;
    padding:74px 78px; align-items:center;}

  /* ---------- LEFT ---------- */
  .left{max-width:820px;}
  .lockup{height:40px; width:auto; display:block; margin-bottom:30px;}
  .eyebrow{display:inline-flex; align-items:center; gap:10px; font-size:15px; font-weight:700;
    letter-spacing:.2em; text-transform:uppercase; color:var(--acc);}
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--acc);
    box-shadow:0 0 12px rgba(49,253,157,.9);}
  h1{margin-top:20px; font-weight:800; font-size:82px; line-height:0.99; letter-spacing:-0.03em;}
  h1 .grad{background:linear-gradient(100deg,var(--cyan),var(--green));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .sub{margin-top:26px; max-width:660px; font-size:24px; line-height:1.5; font-weight:500; color:var(--ink2);}
  .sub b{color:#fff; font-weight:700;}

  /* network rail */
  .rail{margin-top:40px; display:flex; align-items:center; gap:26px;
    background:linear-gradient(180deg,rgba(28,48,70,.72),rgba(22,38,59,.72));
    border:1px solid var(--border); border-radius:22px; padding:22px 26px;
    box-shadow:0 18px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.05); backdrop-filter:blur(6px);
    width:fit-content;}
  .rail-usdc{display:flex; align-items:center; gap:14px;}
  .rail-usdc .ci{width:62px;height:62px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
  .rail-usdc .lbl b{display:block; font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .rail-usdc .lbl span{display:block; font-size:13px; font-weight:600; color:var(--ink3); text-transform:uppercase; letter-spacing:.1em; margin-top:2px;}
  .rail-div{width:1px; height:64px; background:var(--border-str);}
  .chips{display:flex; align-items:flex-start; gap:22px;}
  .chip{display:flex; flex-direction:column; align-items:center; gap:9px; width:76px;}
  .chip .ci{width:48px;height:48px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));}
  .chip span{font-size:13.5px; font-weight:600; color:var(--ink2); letter-spacing:.005em; text-align:center;}

  .foot{margin-top:34px; display:flex; align-items:center; gap:18px;}
  .free-pill{display:inline-flex; align-items:center; gap:10px; padding:12px 20px; border-radius:999px;
    background:linear-gradient(100deg,var(--cyan),var(--green)); color:#04241a; font-weight:800; font-size:17px;
    letter-spacing:.01em; box-shadow:0 0 34px rgba(49,253,157,.42);}
  .url{font-size:17px; font-weight:600; color:var(--ink3); letter-spacing:.02em;}

  /* ---------- RIGHT (phone) ---------- */
  .phone-col{position:relative; display:flex; justify-content:center; align-items:center; height:100%;}
  .phone{position:relative; height:742px;}
  .phone-clip{height:100%; border-radius:42px; overflow:hidden;
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04), 0 0 60px rgba(0,204,255,.10);}
  .phone img{display:block; height:100%; width:auto;}
  .phone-halo{position:absolute; width:640px; height:640px; border-radius:50%;
    background:radial-gradient(circle,rgba(0,204,255,.30),transparent 62%); filter:blur(30px); z-index:-1;}
  .stamp{position:absolute; top:-22px; right:-26px; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:132px; height:132px; border-radius:50%; transform:rotate(9deg);
    background:linear-gradient(135deg,var(--cyan),var(--green)); color:#03241a;
    box-shadow:0 14px 40px rgba(0,0,0,.5), 0 0 44px rgba(51,255,153,.5);
    border:3px solid rgba(255,255,255,.55);}
  .stamp .big{font-size:38px; font-weight:900; line-height:1; letter-spacing:-0.02em;}
  .stamp .small{font-size:14px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; margin-top:4px;}
</style>
</head>
<body>
  <div class="stage" data-screen-label="USDC Free">
    <div class="grid"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>

    <div class="wrap">
      <!-- LEFT -->
      <div class="left">
        <img class="lockup" src="thorwallet-lockup-gradient.png" alt="THORWallet" />
        <div class="eyebrow"><span class="dot"></span>Native USDC · Cross-chain</div>
        <h1>Native USDC swaps.<br /><span class="grad">100% free.</span></h1>
        <p class="sub">Move USDC natively across Ethereum, Arbitrum, Base, Avalanche and Solana. <b>No bridges. No wrapped tokens. No swap fees.</b></p>

        <div class="rail">
          <div class="rail-usdc">
            <img class="ci" src="usdc.png" alt="USDC" />
            <div class="lbl"><b>USDC</b><span>Native</span></div>
          </div>
          <div class="rail-div"></div>
          <div class="chips">
            <div class="chip">
              <img class="ci" src="eth.png" alt="Ethereum" />
              <span>Ethereum</span>
            </div>
            <div class="chip">
              <img class="ci" src="arb.png" alt="Arbitrum" />
              <span>Arbitrum</span>
            </div>
            <div class="chip">
              <svg class="ci" viewBox="0 0 100 100" aria-label="Base">
                <defs><clipPath id="basecut"><rect x="0" y="0" width="66" height="100"/></clipPath></defs>
                <circle cx="50" cy="50" r="50" fill="#0052FF"/>
                <circle cx="48" cy="50" r="30" fill="#fff" clip-path="url(#basecut)"/>
              </svg>
              <span>Base</span>
            </div>
            <div class="chip">
              <img class="ci" src="avax.png" alt="Avalanche" />
              <span>Avalanche</span>
            </div>
            <div class="chip">
              <img class="ci" src="sol.png" alt="Solana" />
              <span>Solana</span>
            </div>
          </div>
        </div>

        <div class="foot">
          <span class="free-pill">$0.00 swap fees</span>
          <span class="url">thorwallet.org</span>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="phone-col">
        <div class="phone-halo"></div>
        <div class="phone">
          <div class="stamp"><span class="big">$0</span><span class="small">Fees</span></div>
          <div class="phone-clip"><img src="phone-swap.png" alt="THORWallet swap - USDC to USDC" /></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
