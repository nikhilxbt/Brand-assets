<!doctype html>

  .nf-logo img { height: 28px; width: auto; margin-bottom: clamp(36px, 6vh, 64px); }
  .nf-code { font-family: var(--font-display); font-weight: 600; font-size: clamp(6rem, 18vw, 12rem); line-height: 0.9; letter-spacing: -0.04em; background: var(--signal-text); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
  .nf h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.4rem, 3vw, 2.2rem); letter-spacing: -0.02em; color: var(--text-hi); margin-top: 18px; }
